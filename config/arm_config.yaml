# ── CAN 버스 설정 ──────────────────────────────────────────────────────────────
can:
  channel: COM3
  bustype: slcan
  bitrate: 1000000

# ── 조인트 → CAN ID 매핑 + 각도 리밋 (단위: deg) ──────────────────────────────
joints:
  joint1: { can_id: 1, limit_min: -90.0, limit_max:  90.0 }
  joint2: { can_id: 2, limit_min: -10.0, limit_max:  90.0 }
  joint3: { can_id: 3, limit_min: -90.0, limit_max:  90.0 }
  joint4: { can_id: 4, limit_min: -50.0, limit_max:  90.0 }
  joint5: { can_id: 5, limit_min: -90.0, limit_max:  90.0 }
  joint6: { can_id: 6, limit_min: -90.0, limit_max:  90.0 }
  joint7: { can_id: 7, limit_min: -90.0, limit_max:  90.0 }

# ── MIT 제어 게인 기본값 ───────────────────────────────────────────────────────
control:
  default_kp: 5.0
  default_kd: 1.0

# ── 모터 물리 한계 (RS01 스펙) ─────────────────────────────────────────────────
motor_limits:
  position: { min: -12.5, max: 12.5 }    # [rad]
  velocity: { min: -44.0, max:  44.0 }   # [rad/s]
  kp:       { min:   0.0, max: 500.0 }
  kd:       { min:   0.0, max:   5.0 }
  torque:   { min: -17.0, max:  17.0 }   # [Nm]
