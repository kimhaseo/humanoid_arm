# ── CAN 버스 설정 ──────────────────────────────────────────────────────────────
can:
  channel: COM3
  bustype: slcan
  bitrate: 1000000

# ── 조인트 → CAN ID 매핑 + 각도 리밋 (단위: deg) ──────────────────────────────
joints:
  joint1: { can_id: 1, motor_model: RS06, limit_min: -90.0, limit_max:  90.0, kp: 100.0, kd: 0.5, sign:  1 }
  joint2: { can_id: 2, motor_model: RS06, limit_min: -90.0, limit_max:  10.0, kp: 100.0, kd: 0.5, sign:  1 }
  joint3: { can_id: 3, motor_model: RS02, limit_min: -90.0, limit_max:  90.0, kp: 100.0, kd: 0.5, sign:  1 }
  joint4: { can_id: 4, motor_model: RS02, limit_min: -85.0, limit_max:  50.0, kp: 100.0, kd: 0.5, sign:  1 }
  joint5: { can_id: 5, motor_model: RS00, limit_min: -90.0, limit_max:  90.0, kp: 50.0, kd: 0.5, sign:  1 }
  joint6: { can_id: 6, motor_model: RS00, limit_min: -90.0, limit_max: 90.0, kp: 50.0, kd: 0.5, sign: 1 }
  joint7: { can_id: 7, motor_model: RS05, limit_min: -90.0, limit_max:  90.0, kp: 30.0, kd: 0.5, sign:  1 }



# ── MIT 제어 게인 기본값 (조인트별 kp/kd 미지정 시 폴백) ──────────────────────
control:
  default_kp: 5.0
  default_kd: 1.0

# ── 모터 물리 한계 (공통) ──────────────────────────────────────────────────────
motor_limits:
  position: { min: -3.14, max: 3.14 }    # [rad] 공통
  kp:       { min:   0.0, max: 500.0 }
  kd:       { min:   0.0, max:   5.0 }

# ── 모터 모델별 스펙 ───────────────────────────────────────────────────────────
motor_models:
  RS00:
    velocity: { min: -44.0, max:  44.0 }  # [rad/s] 임시값 — 실제 스펙 확인 후 수정
    torque:   { min:  -10.0, max:   10.0 }  # [Nm]    임시값 — 실제 스펙 확인 후 수정
  RS02:
    velocity: { min: -44.0, max:  44.0 }  # [rad/s]
    torque:   { min: -12.0, max:  12.0 }  # [Nm]
  RS05:
    velocity: { min: -44.0, max: 44.0 }  # [rad/s]
    torque: { min: -3.5, max: 3.5 }  # [Nm]
  RS06:
    velocity: { min: -15.0, max:  15.0 }  # [rad/s]
    torque:   { min: -25.0, max:  25.0 }  # [Nm]

