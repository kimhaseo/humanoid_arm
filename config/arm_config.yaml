# ── CAN 버스 설정 ──────────────────────────────────────────────────────────────
can:
  channel: COM3
  bustype: slcan
  bitrate: 1000000

# ── 조인트 → CAN ID 매핑 ───────────────────────────────────────────────────────
joints:
  joint1: { can_id: 1 }
  joint2: { can_id: 2 }
  joint3: { can_id: 3 }
  joint4: { can_id: 4 }
  joint5: { can_id: 5 }
  joint6: { can_id: 6 }
  joint7: { can_id: 7 }

# ── MIT 제어 게인 기본값 ───────────────────────────────────────────────────────
control:
  default_kp: 10.0
  default_kd: 0.5

# ── 모터 물리 한계 (RS01 스펙) ─────────────────────────────────────────────────
motor_limits:
  position: { min: -12.5, max: 12.5 }    # [rad]
  velocity: { min: -44.0, max:  44.0 }   # [rad/s]
  kp:       { min:   0.0, max: 500.0 }
  kd:       { min:   0.0, max:   5.0 }
  torque:   { min: -17.0, max:  17.0 }   # [Nm]
